name: secret-scan

# Fails when any tracked file carries private key material, including the
# base64 form. Six real leaf keys were committed to
# docs/deploy/01-k8s-manifests/50-secret-*-tls.yaml as base64 in data.tls.key,
# and a plain `grep "PRIVATE KEY"` finds nothing because the YAML never contains
# the literal PEM header. That invisibility is the whole point of this gate.
#
# Deleting the files does not close the issue — the keys stay in history and stay
# valid until rotated. See
# docs/deploy/03-platform/certmanager/SECURITY-NOTES.md for the rotation and
# history-rewrite procedure.

on:
  push:
    branches: [main, dev, 'UlyssesLeoLee/dev']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-keys:
    name: no private keys in tracked files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the scanner can see a key that was added in this
          # push even when the current tree already removed it.
          fetch-depth: 0

      - name: Scan tracked files
        run: bash tools/scan-for-private-keys.sh

      # Fails the job. `--staged` is deliberately not used here: the full-tree
      # scan is strictly stronger (it covers everything the staged scan would,
      # plus what is already committed), so a second pass could only add noise.
