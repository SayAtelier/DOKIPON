name: commerce-ci

"on":
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'services/**'
      - 'contracts/**'
      - 'tools/e2e_checkout.sh'
      - 'tests/**'
      - '.github/workflows/commerce-ci.yml'
      - 'README.md'
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'services/**'
      - 'contracts/**'
      - 'tools/e2e_checkout.sh'
      - 'tests/**'
      - '.github/workflows/commerce-ci.yml'
  workflow_dispatch:

# Three jobs. Each runs the same set of commands you would locally:
#  cargo test --workspace
#  flutter test on the Dart packages
#  bash tools/e2e_checkout.sh with the order service running
#
# Defaults to ubuntu-latest. macos-latest could be added later if the
# Axum service containers need it (none currently do).

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  # -------------------------------------------------------------------------
  # Job 1 — Rust: cargo fmt --check, clippy with -D warnings, test --workspace
  # Mirror the local recipe so PRs surface the same lint / failure modes.
  # -------------------------------------------------------------------------
  rust:
    name: rust fmt + clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The database the services' repository tests run against.
    #
    # The tests that need a database skip themselves when there is no
    # `DATABASE_URL` — and without this they skipped in every CI run, so the
    # database paths were never actually checked. The schema, the id sequences
    # and the cross-instance visibility are checked here.
    #
    # It is **this job's** variable, not the workflow's: the e2e job has no
    # database, and a service that is given a `DATABASE_URL` and cannot reach
    # it refuses to start (fail closed) — so a workflow-wide `DATABASE_URL`
    # would stop the order service from booting there.
    env:
      DATABASE_URL: postgres://dokipon:dokipon_test_pw@localhost:5432/dokipon_commerce
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dokipon
          POSTGRES_PASSWORD: dokipon_test_pw
          POSTGRES_DB: dokipon_commerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dokipon -d dokipon_commerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 5s
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: 'services -> target'

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - name: cargo fmt --check
        working-directory: services
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        working-directory: services
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test --workspace
        working-directory: services
        run: cargo test --workspace --locked

  # -------------------------------------------------------------------------
  # Job 2 — Dart: install Flutter 3.47.x (matches local pin),
  # `dart pub get` on each package, `flutter test` on the ones with tests.
  # -------------------------------------------------------------------------
  dart:
    name: flutter pub get + test + analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter (3.47.7 stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          dart --version

      - name: dart pub get (each package and app)
        run: |
          for d in packages/* apps/*; do
            echo "--- $d ---"
            (cd "$d" && flutter pub get)
          done

      - name: flutter test (every package that has tests)
        # The tests used to run in one package only, and the other four
        # packages' tests never ran in CI at all — a test that is never run
        # is not a test. Every package and app that has a test file is run
        # here, and the ones without one are skipped rather than failing.
        run: |
          for d in packages/* apps/*; do
            if [ -d "$d/test" ] && [ -n "$(find "$d/test" -name '*_test.dart' -print -quit)" ]; then
              echo "--- $d ---"
              (cd "$d" && flutter test)
            fi
          done

      - name: dart analyze (fatal-infos)
        run: |
          for d in packages/* apps/*; do
            echo "--- analyze: $d ---"
            (cd "$d" && dart analyze --fatal-infos)
          done

  # -------------------------------------------------------------------------
  # Job 3 — End-to-end HTTP smoke:
  #   start commerce-order, run the 22-assertion E2E bash script.
  # Without the PSP / catalog / cart side, the order service runs alone
  # and falls back to the in-memory state machines that already ship in it.
  # -------------------------------------------------------------------------
  e2e:
    name: commerce-order + tools/e2e_checkout.sh
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [rust]   # depends on Rust building the order binary
    # The order service refuses to start without a real LINE credential — a
    # deployment that keeps the development value would accept an id token
    # signed by anyone, and this service verifies those tokens.
    #
    # This job runs the order service alone in a throwaway environment, so it
    # gets its **own** values. They are not the development values (those are
    # published in this repository and are refused), so no
    # "accept the development credentials" flag is needed either.
    env:
      LINE_CHANNEL_ID: ci-channel
      LINE_ID_TOKEN_KEY: ci-signing-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: 'services -> target'

      - name: cargo build -p commerce-catalog -p commerce-inventory -p commerce-order (release)
        working-directory: services
        run: cargo build --release -p commerce-catalog -p commerce-inventory -p commerce-order

      # The order service re-prices every line from the catalogue before it
      # charges anything — the client's own number is a display hint — and it
      # holds the units in the ledger before it asks for the payment. So the
      # checkout script needs the catalogue **and** the inventory service: with
      # neither, every checkout is refused and the script would be asserting
      # against refusals instead of against the Saga.
      - name: Start commerce-catalog in background
        working-directory: services
        run: |
          PORT=8082 ./target/release/commerce-catalog &
          echo "$!" > /tmp/catalog.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8082/healthz >/dev/null; then
              echo "catalog is up"
              exit 0
            fi
            sleep 1
          done
          echo "catalog did not become ready" >&2
          cat /tmp/catalog.pid >&2
          exit 1

      - name: Start commerce-inventory in background
        working-directory: services
        run: |
          PORT=8084 ./target/release/commerce-inventory &
          echo "$!" > /tmp/inventory.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8084/healthz >/dev/null; then
              echo "inventory is up"
              exit 0
            fi
            sleep 1
          done
          echo "inventory did not become ready" >&2
          cat /tmp/inventory.pid >&2
          exit 1

      - name: Start commerce-order in background
        working-directory: services
        env:
          # The binary binds an ephemeral port without this, and the script
          # talks to 8085.
          PORT: 8085
          CATALOG_URL: http://127.0.0.1:8082
          INVENTORY_URL: http://127.0.0.1:8084
        run: |
          ./target/release/commerce-order &
          echo "$!" > /tmp/order.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8085/healthz >/dev/null; then
              echo "order is up"
              exit 0
            fi
            sleep 1
          done
          echo "order did not become ready" >&2
          cat /tmp/order.pid >&2
          exit 1

      - name: bash tools/e2e_checkout.sh
        run: bash tools/e2e_checkout.sh

      - name: Stop the services
        if: always()
        run: |
          if [ -f /tmp/order.pid ]; then
            kill "$(cat /tmp/order.pid)" || true
          fi
          if [ -f /tmp/catalog.pid ]; then
            kill "$(cat /tmp/catalog.pid)" || true
          fi
          if [ -f /tmp/inventory.pid ]; then
            kill "$(cat /tmp/inventory.pid)" || true
          fi
