[package]
name = "commerce-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
tracing = { workspace = true }
sha2 = "0.10"
# The shared price authority fetches catalogue prices over HTTP.
reqwest = { workspace = true }
# The store that keeps a sale: a database every instance of a Function
# shares. The services that persist use it; the local run does not have one
# and keeps its state in memory on purpose.
sqlx = { workspace = true }

[dev-dependencies]
# The tests use #[tokio::test] and spin up a local server.
tokio = { workspace = true, features = ["full"] }
axum = { workspace = true }
tower = { workspace = true, features = ["util"] }
