[workspace]
resolver = "2"
members = [
    "crates/commerce-core",
    "crates/commerce-bff",
    "crates/commerce-identity",
    "crates/commerce-catalog",
    "crates/commerce-cart",
    "crates/commerce-inventory",
    "crates/commerce-order",
    "crates/commerce-payment-adapter",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip", "request-id"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "macros",
    "migrate",
] }
async-trait = "0.1"
http = "1"
http-body-util = "0.1"
urlencoding = "2"

[profile.release]
lto = "thin"
codegen-units = 1
