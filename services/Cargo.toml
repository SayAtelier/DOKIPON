[workspace]
resolver = "2"
members = [
    "crates/commerce-core",
    "crates/commerce-bff",
    "crates/commerce-identity",
    "crates/commerce-catalog",
    "crates/commerce-cart",
    "crates/commerce-inventory",
    "crates/commerce-order",
    "crates/commerce-payment-adapter",
    "crates/commerce-admin",
    "crates/commerce-content",
    "crates/commerce-edge",
    # TEST FIXTURE ONLY — a deterministic mock of the commerce services, for
    # the `[Designed]` cases in docs/ecommerce/05-test/テスト設計書.md §3.
    # It is a workspace member so it builds and is tested together with the
    # rest of `services/`, but it is NOT a product dependency: no crate in
    # `services/` may depend on it, and it must not depend on a product
    # service either. Its `bin/` entry points are meant to be started by a
    # test and hit over HTTP.
    "crates/commerce-mocks",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip", "request-id"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "macros",
    "migrate",
] }
async-trait = "0.1"
http = "1"
http-body-util = "0.1"
urlencoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
lto = "thin"
codegen-units = 1
