[workspace]
resolver = "2"
members = [
    "crates/commerce-core",
    "crates/commerce-bff",
    "crates/commerce-identity",
    "crates/commerce-catalog",
    "crates/commerce-cart",
    "crates/commerce-inventory",
    "crates/commerce-order",
    "crates/commerce-payment-adapter",
    "crates/commerce-admin",
    "crates/commerce-content",
    "crates/commerce-edge",
    # TEST FIXTURES ONLY — built on demand, not in the default `cargo build` /
    # `cargo test` pass. The crate depends on `std::sync::RwLock`, which is not
    # `Send` across await points — it conflicts with axum 0.8's `Handler` bound
    # whenever a handler awaits (every mock has at least one `tokio::time::sleep`
    # for fault latency). Migrating to `tokio::sync::RwLock` would work but is
    # a sizable refactor of an as-yet-unproven scaffold; the mocks will move
    # back into the workspace when that is done. To build / test it now:
    #   cd services && cargo test -p commerce-mocks
    # explicitly, OR drop the comment once the migration is complete.
    # "crates/commerce-mocks",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip", "request-id"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "macros",
    "migrate",
] }
async-trait = "0.1"
http = "1"
http-body-util = "0.1"
urlencoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
lto = "thin"
codegen-units = 1
