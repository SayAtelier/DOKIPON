apiVersion: apps/v1
kind: Deployment
metadata:
  name: commerce-order
  namespace: commerce
  labels:
    app: commerce-order
spec:
  replicas: 1
  selector:
    matchLabels:
      app: commerce-order
  template:
    metadata:
      labels:
        app: commerce-order
    spec:
      containers:
      - name: commerce-order
        image: docker.io/dokipon/commerce-order:0.1.0
        imagePullPolicy: Never
        envFrom:
        - configMapRef:
            name: commerce-config
        env:
        - name: PORT
          value: '8085'
        # The credential the admin facade presents to ask for the operator's
        # view of the orders. The order service serves that view only to a
        # caller that holds it, so a customer cannot reach it by asking.
        - name: SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: commerce-service-credentials
              key: SERVICE_TOKEN
        ports:
        - name: http
          containerPort: 8085
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8085
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8085
          initialDelaySeconds: 10
          periodSeconds: 15
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL

