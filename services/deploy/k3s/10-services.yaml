apiVersion: apps/v1
kind: Deployment
metadata:
  name: commerce-bff
  namespace: commerce
  labels:
    app: commerce-bff
spec:
  replicas: 1
  selector:
    matchLabels:
      app: commerce-bff
  template:
    metadata:
      labels:
        app: commerce-bff
    spec:
      containers:
      - name: commerce-bff
        image: docker.io/dokipon/commerce-bff:0.1.0
        imagePullPolicy: Never
        envFrom:
        - configMapRef:
            name: commerce-config
        env:
        - name: PORT
          value: '8080'
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: commerce-bff
  namespace: commerce
  labels:
    app: commerce-bff
spec:
  type: ClusterIP
  selector:
    app: commerce-bff
  ports:
  - name: http
    port: 8080
    targetPort: 8080

