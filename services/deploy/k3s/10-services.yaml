apiVersion: apps/v1
kind: Deployment
metadata:
  name: commerce-admin
  namespace: commerce
  labels:
    app: commerce-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: commerce-admin
  template:
    metadata:
      labels:
        app: commerce-admin
    spec:
      containers:
      - name: commerce-admin
        image: docker.io/dokipon/commerce-admin:0.1.0
        imagePullPolicy: Never
        envFrom:
        - configMapRef:
            name: commerce-config
        env:
        - name: PORT
          value: '8087'
        - name: ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: commerce-admin-credentials
              key: ADMIN_USER
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: commerce-admin-credentials
              key: ADMIN_PASSWORD
        - name: OPERATOR_USER
          valueFrom:
            secretKeyRef:
              name: commerce-admin-credentials
              key: OPERATOR_USER
        - name: OPERATOR_PASSWORD
          valueFrom:
            secretKeyRef:
              name: commerce-admin-credentials
              key: OPERATOR_PASSWORD
        - name: VIEWER_USER
          valueFrom:
            secretKeyRef:
              name: commerce-admin-credentials
              key: VIEWER_USER
        - name: VIEWER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: commerce-admin-credentials
              key: VIEWER_PASSWORD
        ports:
        - name: http
          containerPort: 8087
        readinessProbe:
          tcpSocket:
            port: 8087
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 8087
          initialDelaySeconds: 10
          periodSeconds: 15
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: commerce-admin
  namespace: commerce
  labels:
    app: commerce-admin
spec:
  type: ClusterIP
  selector:
    app: commerce-admin
  ports:
  - name: http
    port: 8087
    targetPort: 8087

