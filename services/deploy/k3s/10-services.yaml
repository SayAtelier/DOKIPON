kind: Service
metadata:
  name: commerce-admin
  namespace: commerce
  labels:
    app: commerce-admin
spec:
  type: ClusterIP
  selector:
    app: commerce-admin
  ports:
  - name: http
    port: 8087
    targetPort: 8087

