---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commerce-admin
  namespace: commerce
  labels:
    app: commerce-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: commerce-admin
  template:
    metadata:
      labels:
        app: commerce-admin
    spec:
      containers:
      - name: commerce-admin
        image: docker.io/dokipon/commerce-admin:0.1.0
        imagePullPolicy: Never
        envFrom:
        - configMapRef:
            name: commerce-config
        env:
        - name: PORT
          value: '8087'
        # The credential the facade presents to the order service for the
        # operator's view of the orders.
        - name: SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: commerce-service-credentials
              key: SERVICE_TOKEN
        - name: ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: commerce-admin-credentials
              key: ADMIN_USER
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: commerce-admin-credentials
              key: ADMIN_PASSWORD
        - name: OPERATOR_USER
          valueFrom:
            secretKeyRef:
              name: commerce-admin-credentials
              key: OPERATOR_USER
              # The operator and the viewer are optional roles. The Secret
              # this manifest ships does not define them, and a missing key
              # that is not marked optional stops the container from starting
              # at all — so the admin console would never come up.
              optional: true
        - name: OPERATOR_PASSWORD
          valueFrom:
            secretKeyRef:
              name: commerce-admin-credentials
              key: OPERATOR_PASSWORD
              optional: true
        - name: VIEWER_USER
          valueFrom:
            secretKeyRef:
              name: commerce-admin-credentials
              key: VIEWER_USER
              optional: true
        - name: VIEWER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: commerce-admin-credentials
              key: VIEWER_PASSWORD
              optional: true
        ports:
        - name: http
          containerPort: 8087
        readinessProbe:
          tcpSocket:
            port: 8087
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 8087
          initialDelaySeconds: 10
          periodSeconds: 15
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL

---
