[package]
name = "dokipon-vercel"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"
description = "The DOKIPON commerce edge, packaged for the Vercel Rust runtime."

[dependencies]
commerce-edge = { path = "services/crates/commerce-edge" }
commerce-admin = { path = "services/crates/commerce-admin" }

vercel_runtime = { version = "2.4", features = ["axum"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "dokipon-edge"
path = "api/index.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
strip = "symbols"
