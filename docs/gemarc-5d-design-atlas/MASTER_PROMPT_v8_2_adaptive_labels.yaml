      - "Microservices"

    candidate_domains:
      - "Identity"
      - "Catalog"
      - "Cart"
      - "Inventory"
      - "Order"
      - "Payment Adapter"
      - "Notification"
      - "Audit"

    service_contracts:
      - "Responsibility"
      - "Service Boundary"
      - "Data Ownership"
      - "OpenAPI"
      - "AsyncAPI Where Applicable"
      - "JSON Schema"
      - "Authentication"
      - "Authorization"
      - "Idempotency"
      - "Outbox / Inbox"
      - "Saga"
      - "Timeout / Retry"
      - "Observability"
      - "Rollback"
      - "Tests"

  implementation_task_contract:
    - "taskId"
    - "requirementIds"
    - "sourceAndEvidence"
    - "inputContracts"
    - "targetModules"
    - "dependencies"
    - "implementationConstraints"
    - "promptId"
    - "normalCases"
    - "exceptionCases"
