    - "Low Cognitive Load"
    - "Visual Consistency"
    - "Engineering Readability"
    - "Context Awareness"
    - "Progressive Disclosure"
    - "Accessibility"
    - "Precise Interaction"

  theme:

    background: "#0B1220"
    surface: "#121D2E"
    elevated_surface: "#1C2A3D"

    text_primary: "#E8EFF7"
    text_secondary: "#AAB9CB"

    focus: "#5AC7C3"
    information: "#82ADFA"

    success: "#74CA9D"
    warning: "#F0BA63"
    failure: "#F08886"

    muted_edge: "#40536A"

  color_principles:

    - "低饱和优先"
    - "重点色克制使用"
    - "领域色语义稳定"
    - "状态色与领域色独立"
    - "因果差异具有专用视觉通道"
    - "重要信息不能仅依靠颜色表达"
    - "支持高对比度主题"
    - "支持浅色主题"

  typography:

    - "明确字号阶梯"
    - "统一行高"
    - "统一文字基线"
    - "统一数字格式"
    - "中日英字体回退"
    - "免费可商用字体优先"
    - "长文本自动适配"
    - "避免文字超框"

  spacing:

    design_grid: "4px / 8px System"

    rules:
      - "统一内边距"
      - "统一卡片间距"
      - "统一面板层级"
      - "统一标签对齐"
      - "禁止重叠"
      - "控制最小点击区域"

  layout:

    header: >-
      项目名称、版本、
