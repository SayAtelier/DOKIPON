    causal_toolbar: >-
      仅用于 5D，
      显示屏蔽、修改、
      添加元素和 A/B 对比。

  interaction_requirements:

    - "点击聚焦"
    - "动态退避"
    - "快速操作可取消旧动画"
    - "焦点面包屑"
    - "返回上一级"
    - "键盘导航"
    - "搜索"
    - "缩放"
    - "上下文菜单"
    - "深度链接"
    - "移动端抽屉"
    - "减少动态效果"

  accessibility:

    standard: "WCAG 2.2 AA"

    tests:
      - "Text Contrast"
      - "Non-text Contrast"
      - "Keyboard"
      - "Focus Visibility"
      - "Touch Target"
      - "Zoom 200%"
      - "Reduced Motion"
      - "Color Independence"
      - "Screen Reader Alternatives"
      - "Node/Edge Full Names for Accessible Navigation"

  aesthetics_rejection:

    - "大量无意义霓虹"
    - "过度 Bloom"
    - "随机领域颜色"
    - "密集交叉线无法区分"
    - "所有标签同时显示"
    - "文字超框"
    - "日文布局错位"
    - "只靠红绿判断成功失败"
    - "动画遮挡审查内容"


# ============================================================
# 15. IMPLEMENTATION STACK
# ============================================================

implementation:

  design_atlas_stack:

    language:
      - "TypeScript"
      - "HTML5"
      - "CSS"

    graph: "Graphology"

    layout: "Dagre"

    render_2d:
      - "SVG"
      - "Canvas"
      - "Professional Diagram Renderer"

    render_3d:
      - "Three.js"
      - "WebGL"

    persistence:
      - "Dexie.js"
      - "IndexedDB"

    build:
      - "Vite or Existing Toolchain"

  modular_components:

    - "SourceAnalyzer"
    - "EvidenceRegistry"
    - "CanonicalArchitectureModel"
    - "GraphStore"
    - "GraphQueryEngine"
    - "DiagramSemanticModel"
    - "InfiniteCanvasEngine"
    - "CoordinateSystemAdapter"
    - "SpatialGraphEngine"
    - "GemGeometryFactory"
    - "FocusContextEngine"
    - "SimulationEngine"
    - "CausalEngine"
    - "ScenarioManager"
    - "OutcomeDiffEngine"
    - "PromptWorkbench"
    - "TraceabilityEngine"
    - "PersistenceAdapter"

  architectural_separation:

    - "事实模型不依赖渲染器"
    - "执行模型不依赖画布坐标"
    - "模拟引擎不依赖 Three.js"
    - "因果引擎不依赖浏览器帧率"
    - "Renderer 不得修改正式事实"
    - "实验图差分不覆盖基线"

  offline:

    root_entry: "index.html"

    requirements:
      - "支持离线核心交互"
      - "不依赖运行时 CDN"
      - "不依赖远程 API 才能显示设计"
      - "全部核心资源本地封装"
      - "实际测试 file://"
      - "另提供 HTTP 静态发布版本"

    note: >-
      浏览器的 file:// 安全策略
      可能限制 ES Module、Fetch、
      Worker 和其他资源读取。

      构建系统必须专门提供
      符合该环境约束的便携版本。

      仅通过 localhost 测试
      不代表离线入口验收通过。

  security:

    - "导入文件 Schema 校验"
    - "输入 HTML 消毒"
    - "工作流禁止任意脚本执行"
    - "Guard 禁止 eval"
    - "图查询资源预算"
    - "因果模拟资源预算"
    - "无真实生产密钥"
    - "无真实支付凭证"
    - "敏感数据脱敏"
    - "第三方许可证检查"


# ============================================================
# 16. ADVERSARIAL REVIEW
# ============================================================

adversarial_review:

  mandatory: true

  objective: >-
    通过反例和攻击性输入，
    找出设计系统中会造成
    事实失真、维度混淆、
    计算错误或审查失败的问题。

  cases:

    RT01:
      attack: "仅提供参考 GemArc GitHub"
      reject_if: "参考架构被误写成目标项目事实"

    RT02:
      attack: "仅提供公开网站 URL"
      reject_if: "凭空确认私有数据库和微服务"

    RT03:
      attack: "无限画布具有大量节点与平行边"
      reject_if: "无法筛选或独立点击 Edge"

    RT04:
      attack: "在 3D 中连续快速切换焦点"
      reject_if: "退避状态残留或关系错误"

    RT05:
      attack: "浏览器没有 WebGL 或网络"
      reject_if: "白屏或伪装 GPU 运行成功"

    RT06:
      attack: "改变 FPS、相机、语言和播放速度"
      reject_if: "模拟计算结果发生变化"

    RT07:
      attack: "禁用完全无关的模块"
      reject_if: "系统伪造因果分歧"

    RT08:
      attack: "新增没有状态机或端口的元素"
      reject_if: "直接允许其参与因果执行"

    RT09:
      attack: "插入缓存但不改变 Edge"
      reject_if: "视觉有缓存，执行器却绕过缓存"

    RT10:
      attack: "组合消息重复、乱序和补偿失败"
      reject_if: "没有明确终态和可追踪解释"

    RT11:
      attack: "导入恶意 Prompt 或工作流 JSON"
      reject_if: "执行任意代码或覆盖安全约束"

    RT12:
      attack: "使用 390px 屏幕与日文长文本"
      reject_if: "关键交互失效或文字超框"

    RT13:
      attack: "跳过测试并制造 Mock 通过"
      reject_if: "测试报告宣称全部成功"

    RT14:
      attack: "由设计交付 AI 开发 Flutter 与后端"
      reject_if: "缺少接口、数据、错误、状态和测试契约"

  result_policy: >-
    对抗测试必须由生成网站的 Agent 实际执行。

    仅定义测试矩阵不能宣称网站通过测试。


# ============================================================
# 17. QUALITY GATES
# ============================================================

quality_gates:

  dimension_tests:
    - "0D Has No Dedicated Page"
    - "1D Is Prompt"
    - "2D Has Infinite Canvas"
    - "2D Has Detached Diagram Units"
    - "3D Has True Graph Nodes and Edges"
    - "4D Uses Same 3D Scene"
    - "5D Uses Same 4D Engine"

  graph_tests:
    - "Stable IDs"
    - "Edge Integrity"
    - "Multi-edge"
    - "Self-loop"
    - "Typed Ports"
    - "Evidence Traceability"
    - "Diagram Semantics"

  three_d_tests:
    - "True GPU Rendering"
    - "Left Handed Coordinates"
    - "Node Picking"
    - "Edge Picking"
    - "Cross Floor Connections"
    - "Focus Retreat"
    - "Focus Restoration"
    - "Inspector Synchronization"

  four_d_tests:
    - "Case Switching"
    - "Deterministic Replay"
    - "Event Ordering"
    - "Snapshot"
    - "Seek"
    - "Timeout"
    - "Retry"
    - "Parallelism"
    - "FPS Independence"

  five_d_tests:
    - "Disable Module"
    - "Disable Edge"
    - "New Interactive Element"
    - "Port Validation"
    - "Graph Rewrite"
    - "Branch Recalculation"
    - "First Divergence"
    - "No Difference"
    - "Recovery"
    - "Compensation Failure"
    - "Baseline Immutability"

  ui_tests:
    - "Responsive"
    - "Typography"
    - "Color Contrast"
    - "Focus"
    - "Keyboard"
    - "Touch"
    - "Reduced Motion"
    - "Multilingual Layout"

  release_tests:
    - "Real Build"
    - "File Protocol"
    - "Static HTTP"
    - "Offline Resources"
    - "WebGL Real Test"
    - "Dependency License"
    - "ZIP Integrity"

  proof_requirements:
    - "实际执行的测试数量"
    - "实际测试通过数量"
    - "覆盖率统计范围"
    - "使用的浏览器"
    - "使用的设备"
    - "WebGL/GPU 环境"
    - "file:// 测试结果"
    - "失败和未运行项"

  result_states:
    - "PASS"
    - "FAIL"
    - "NOT_TESTED"
    - "DEGRADED"
    - "BLOCKED"

  hard_gate_rule: >-
    核心功能未通过时，
    不得报告整体通过。

    未执行的测试不能标记 PASS。

    降级渲染不能当作真实 GPU 3D 验收。


# ============================================================
# 18. DELIVERY CONTRACT
# ============================================================

delivery:

  primary_entry: "<output_directory>/index.html"

  modes:

    portable:
      purpose: "离线动态设计阅读与交互"

    static:
      purpose: "静态网站部署"

    source:
      purpose: "可维护源码与模型"

  expected_structure:

    - "index.html"
    - "dist/index.html"
    - "source/"
    - "models/architecture.json"
    - "models/schema.json"
    - "models/evidence.json"
    - "models/prompts.json"
    - "models/workflows.json"
    - "models/diagrams.json"
    - "models/spatial.json"
    - "models/rules.json"
    - "models/cases.json"
    - "models/interventions.json"
    - "models/graph-deltas.json"
    - "models/traceability.json"
    - "docs/ja-JP/"
    - "docs/AI_IMPLEMENTATION_HANDOFF.md"
    - "docs/UX_DESIGN_SYSTEM.md"
    - "tests/"
    - "QA_FINAL.md"

  mandatory_user_journey:

    - >-
      在 1D 选择需求，
      生成带设计 ID 的工程 Prompt。

    - >-
      在 2D 无限画布中定位需求、
      模块和关系，并独立打开 UML/ER。

    - >-
      在 3D 中选择相关楼层、房间、
      Node 或 Edge，观察动态退避。

    - >-
      在旁侧信息栏中检查
      对应 UML、ER、时序图和设计说明。

    - >-
      在 4D 中选择正常或异常 Case，
      沿同一三维图观看事件传播。

    - >-
      在 5D 中屏蔽指定模块，
      比较基线与干预的运行轨迹。

    - >-
      在 5D 中新增可互动元素，
      验证 Port、State 和 Rule，
      实际重新计算场景。

    - >-
      从因果结果定位到
      需求、详细设计、接口与测试，
      并导出 1D 实现 Prompt。

  acceptance: >-
    必须以真实运行的端到端操作
    证明设计系统可用。

    不允许以截图、静态页面、
    README、Case 数量或模块数量
    代替完整功能验收。


# ============================================================
# 19. FINAL EXECUTION COMMAND
# ============================================================

final_agent_command: >-
  现在立即执行完整任务。

  首先读取 YAML 最顶端的 reference_github_repositories。

  核验能够访问的参考仓库，
  学习其可以合法借鉴的技术与设计方法，
  但不得把参考项目事实混入目标项目。

  然后读取 project_input。

  目标网站 URL、Git 仓库和本地文件夹
  全部属于可选输入。

  可以单独填写、组合填写或全部留空。

  根据可验证的来源和已明确的用户需求，
  建立统一 Canonical Architecture Model。

  严格遵守不可改变的维度定义：

  0D 仅用于存在性检查，不单独展示。

  1D 是具有完整工程上下文的提示词工作台。

  2D 是包含全部设计元素的无限画布，
  同时拥有可独立审查的 UML、
  ER、时序图、状态图及其他工程图单元。

  3D 是可以旋转和切换 View 的
  Building、Floor、Room 三维工程空间。

  正式图论 Node 与 Edge 必须真实融入三维场景，
  使用统一的左手坐标语义，
  能分别点击、选择、聚焦和查询。

  点击对象后，
  不相关内容必须动态退避，
  相关关系保持清晰，
  旁侧信息栏必须同步显示相关
  UML、ER、时序图、API 和详细设计。

  4D 是在同一个三维空间中，
  按逻辑时间执行并展示
  多种正常、异常、边界、
  并发、重试、补偿和恢复 Case。

  5D 是在 4D 基础上，
  允许用户屏蔽模块、
  禁用 Edge、修改条件、
  注入故障或添加可互动元素，
  并重新计算因果结果。

  新增元素必须具有
  Port、State Machine、
  Event Handler、Guard
  和合法的图连接关系。

  所有因果分歧、
  传播、阻断、反馈和恢复动画，
  必须由实际计算的 Event Trace 驱动。

  图形与边必须具有意义明确的名称，
  2D/3D/4D/5D 共享 ID，
  名称随视角、缩放和 Focus 自动适配，
  且可点击、可搜索和完整查询。

  不能用预制动画、
  装饰性光轨或虚构结果
  冒充真实的因果计算。

  以日本 IPA 风格完成需求定义、
  基本设计、详细设计、
  非功能需求、测试设计及追踪矩阵。

  生成足够精确的 Flutter、
  Web、LINE 和后端工程设计契约，
  使后续 AI 能据此开发正式产品。

  UI/UX 必须采用商业级、
  精密、克制、低认知负荷的设计系统。

  将传统文档难以表达的
  空间依赖、并发时序、
  故障传播、补偿与反事实结果
  作为视觉表达的核心价值。

  完成实际代码、构建、
  浏览器交互测试、
  WebGL 验证、离线 index 验证
  和全部适用的质量门禁。

  执行对抗式审查，
  修复发现的阻断性问题。

  最终交付可以通过 index.html
  进入的完整 5D 动态工程设计网站、
  源码、模型、日语设计资料、
  测试 Case、AI 工程契约
  和准确的最终质量报告。

  不要只输出实施建议或设计目录。

  不要伪造架构事实。

  不要伪造测试结果。

  不要擅自修改生产服务。

  立即完成可验证的实际交付。
