        selectionPolicy: MatchUpstream
  - origin:
      kind: Warehouse
      name: warehouse-economy
    sources:
      stages:
      - staging
      autoPromotionOptions:
        selectionPolicy: MatchUpstream
  - origin:
      kind: Warehouse
      name: warehouse-match
    sources:
      stages:
      - staging
      autoPromotionOptions:
        selectionPolicy: MatchUpstream
  - origin:
      kind: Warehouse
      name: warehouse-social
    sources:
      stages:
      - staging
      autoPromotionOptions:
        selectionPolicy: MatchUpstream
  - origin:
      kind: Warehouse
      name: warehouse-admin
    sources:
      stages:
      - staging
      autoPromotionOptions:
        selectionPolicy: MatchUpstream
  - origin:
      kind: Warehouse
      name: warehouse-clusterOps
