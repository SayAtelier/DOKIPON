# 每个服务由独立 Warehouse 发现镜像；Freight 由 Kargo 自动生成
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: warehouse-player
  namespace: rust-game-server
spec:
  freightCreationPolicy: Automatic
  subscriptions:
  - image:
      repoURL: ghcr.io/UlyssesLeoLee/rustgameserver
      allowTagsRegexes:
      - ^0\.1\.0-cc13$
  - git:
      repoURL: https://github.com/SayAtelier/DOKIPON.git
      branch: main
  freightCreationCriteria:
    expression: 'imageFrom("ghcr.io/UlyssesLeoLee/rustgameserver").Annotations["org.opencontainers.image.source"] != nil &&

      imageFrom("ghcr.io/UlyssesLeoLee/rustgameserver").Annotations["org.opencontainers.image.revision"] != nil &&

      imageFrom("ghcr.io/UlyssesLeoLee/rustgameserver").Annotations["org.opencontainers.image.sbom"] != nil'
---
