      group: argoproj.io
      version: v1alpha1
      kind: Rollout
      name: battle-service
    fieldPaths:
    - spec.template.spec.containers.0.image
- source:
    kind: ConfigMap
    name: rgs-image-tags
    fieldPath: data.networkGatewayImage
  targets:
  - select:
      group: argoproj.io
      version: v1alpha1
      kind: Rollout
      name: network-gateway
    fieldPaths:
    - spec.template.spec.containers.0.image
patches:
- target:
    group: apps
    version: v1
    kind: Deployment
    name: player-service
  patch: "- op: replace\n  path: /spec/replicas\n  value: 0\n"
- target:
    group: argoproj.io
    version: v1alpha1
    kind: Rollout
    name: player-service
  patch: "- op: replace\n  path: /spec/replicas\n  value: 1\n- op: add\n  path: /spec/template/spec/containers/0/imagePullPolicy\n\
    \  value: Always\n- op: replace\n  path: /spec/template/spec/containers/0/env/8/value\n  value: '1'"
