# dev 环境 overlay：副本数 1，不安全 gRPC 值 1
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rust-game-server
resources:
- ../../../01-k8s-manifests
- ../../rollouts
- image-tags.yaml
configMapGenerator:
- name: prometheus-config
  behavior: merge
  files:
  - prometheus.yml=../common/prometheus.yml
generatorOptions:
  disableNameSuffixHash: true
replacements:
- source:
    kind: ConfigMap
    name: rgs-image-tags
    fieldPath: data.playerImage
  targets:
  - select:
      group: argoproj.io
      version: v1alpha1
      kind: Rollout
      name: player-service
    fieldPaths:
    - spec.template.spec.containers.0.image
- source:
    kind: ConfigMap
    name: rgs-image-tags
    fieldPath: data.economyImage
  targets:
  - select:
      group: argoproj.io
      version: v1alpha1
      kind: Rollout
      name: economy-service
    fieldPaths:
    - spec.template.spec.containers.0.image
- source:
    kind: ConfigMap
    name: rgs-image-tags
    fieldPath: data.matchImage
  targets:
  - select:
      group: argoproj.io
      version: v1alpha1
      kind: Rollout
      name: match-service
    fieldPaths:
    - spec.template.spec.containers.0.image
- source:
    kind: ConfigMap
    name: rgs-image-tags
    fieldPath: data.socialImage
  targets:
