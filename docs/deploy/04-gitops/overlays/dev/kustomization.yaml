- source:
    kind: ConfigMap
    name: rgs-image-tags
    fieldPath: data.clusterOpsImage
  targets:
  - select:
      group: argoproj.io
      version: v1alpha1
      kind: Rollout
      name: cluster-ops
    fieldPaths:
    - spec.template.spec.containers.0.image
- source:
    kind: ConfigMap
    name: rgs-image-tags
    fieldPath: data.gmBackendImage
  targets:
  - select:
      group: argoproj.io
      version: v1alpha1
      kind: Rollout
      name: gm-backend
