# Prometheus 抓取目标；各 RGS 服务指标使用 9464 端口
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: rgs-dev
scrape_configs:
- job_name: prometheus
  static_configs:
  - targets:
    - localhost:9090
- job_name: otel-collector
  static_configs:
  - targets:
    - otel-collector.rust-game-server.svc.cluster.local:8889
- job_name: rgs-services
  metrics_path: /metrics
  static_configs:
  - targets:
    - player-service.rust-game-server.svc.cluster.local:9464
    - economy-service.rust-game-server.svc.cluster.local:9464
    - match-service.rust-game-server.svc.cluster.local:9464
    - social-service.rust-game-server.svc.cluster.local:9464
    - admin-service.rust-game-server.svc.cluster.local:9464
    - cluster-ops.rust-game-server.svc.cluster.local:9464
    - gm-backend.rust-game-server.svc.cluster.local:9464
    - scene-service.rust-game-server.svc.cluster.local:9464
    - battle-service.rust-game-server.svc.cluster.local:9464
    - network-gateway.rust-game-server.svc.cluster.local:9464
