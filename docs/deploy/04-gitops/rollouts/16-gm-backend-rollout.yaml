# gm-backend 的 Rollout；PodSpec 从现有 Deployment 复制
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: gm-backend
  namespace: rust-game-server
  labels:
    app.kubernetes.io/name: gm-backend
    app.kubernetes.io/component: gm-apigw
    app.kubernetes.io/part-of: rust-game-server
    app.kubernetes.io/version: 0.1.0
    rust-game-server.io/role: external-api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gm-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gm-backend
        app.kubernetes.io/component: gm-apigw
        app.kubernetes.io/part-of: rust-game-server
        app.kubernetes.io/version: 0.1.0
        rust-game-server.io/role: external-api-gateway
    spec:
      serviceAccountName: gm-backend-service-account
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: gm-backend
        image: ghcr.io/UlyssesLeoLee/rustgameserver:0.1.0-gm-backend
        imagePullPolicy: Never
        command:
        - /app/bin/gm-backend
        env:
        - name: RUST_LOG
          value: info,gm-backend=debug
        - name: GM_HTTP_ADDR
          value: 0.0.0.0:8443
        - name: GM_HEALTH_ADDR
          value: 0.0.0.0:8081
        - name: ADMIN_GRPC_ENDPOINT
          value: http://admin-service:50055
        - name: RGS_DOMAIN
          value: gm-backend
        - name: RGS_ALLOW_INSECURE_GRPC
          value: '0'
        - name: OTEL_SERVICE_NAME
          value: gm-backend
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector:4317
        ports:
        - name: https
          containerPort: 8443
          protocol: TCP
        - name: health
          containerPort: 8081
          protocol: TCP
        - name: metrics
          containerPort: 9464
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: gm-backend
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
  strategy:
    canary:
      steps:
      - setWeight: 10
      - pause:
          duration: 5m
      - analysis:
          templates:
          - templateName: rgs-canary-analysis
          args:
          - name: service-name
            value: gm-backend
      - setWeight: 50
      - pause:
          duration: 5m
      - analysis:
          templates:
          - templateName: rgs-canary-analysis
          args:
          - name: service-name
            value: gm-backend
      - setWeight: 100
      - pause:
          duration: 5m
      - analysis:
          templates:
          - templateName: rgs-canary-analysis
          args:
          - name: service-name
            value: gm-backend
