# admin-service 的 Rollout；PodSpec 从现有 Deployment 复制
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: admin-service
  namespace: rust-game-server
  labels:
    app.kubernetes.io/name: admin
    app.kubernetes.io/component: coc-control-plane
    app.kubernetes.io/part-of: rust-game-server
    app.kubernetes.io/version: 0.1.0
    rust-game-server.io/coc: 'true'
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin
        app.kubernetes.io/component: coc-control-plane
        app.kubernetes.io/part-of: rust-game-server
        app.kubernetes.io/version: 0.1.0
        rust-game-server.io/coc: 'true'
    spec:
      serviceAccountName: admin-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
      - name: ghcr-pull
      containers:
      - name: admin
        image: ghcr.io/UlyssesLeoLee/rustgameserver:0.1.0-cc13
        imagePullPolicy: IfNotPresent
        command:
        - /app/bin/admin-service
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - name: grpc
          containerPort: 50055
          protocol: TCP
        - name: coc-web
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 9464
          protocol: TCP
        env:
        - name: RUST_LOG
          value: info,admin-service=debug,sqlx=warn,tonic=warn
        - name: GRPC_ADDR
          value: 0.0.0.0:50055
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: admin-db-credentials
              key: url
        - name: NATS_URI
          value: nats://nats:4222
        - name: RGS_TLS_DIR
          value: /etc/rgs/certs
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector:4317
        - name: OTEL_SERVICE_NAME
          value: admin-service
        - name: RGS_DOMAIN
          value: admin
        - name: COC_BIND_ADDR
          value: 0.0.0.0:8080
        - name: ADMIN_AUDIT_LOG_RETENTION_DAYS
          value: '365'
        - name: COC_OPERATOR_REQUIRE_MFA
          value: 'true'
        - name: PFAU_CONFIRM_DUAL_OPERATOR
          value: 'true'
        - name: RGS_ALLOW_INSECURE_GRPC
          value: '0'
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          exec:
            command:
            - /bin/grpc_health_probe
            - -addr=127.0.0.1:50055
            - -tls
            - -tls-client-cert=/etc/rgs/certs/server.pem
            - -tls-client-key=/etc/rgs/certs/server.key
            - -tls-ca-cert=/etc/rgs/certs/ca.pem
            - -tls-server-name=admin.service
            - -connect-timeout=2s
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /bin/grpc_health_probe
            - -addr=127.0.0.1:50055
            - -tls
            - -tls-client-cert=/etc/rgs/certs/server.pem
            - -tls-client-key=/etc/rgs/certs/server.key
            - -tls-ca-cert=/etc/rgs/certs/ca.pem
            - -tls-server-name=admin.service
            - -connect-timeout=2s
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: rgs-tls
          mountPath: /etc/rgs/certs
          readOnly: true
        - name: coc-tls
          mountPath: /etc/rgs/coc
          readOnly: true
      volumes:
      - name: rgs-tls
        projected:
          sources:
          - secret:
              name: rgs-secret-admin-tls
              items:
              - key: tls.crt
                path: server.pem
              - key: tls.key
                path: server.key
          - secret:
              name: rgs-secret-ca
              items:
              - key: ca.pem
                path: ca.pem
      - name: coc-tls
        secret:
          secretName: coc-ops-secret
          items:
          - key: coc-admin-password
            path: coc-admin-password
          - key: coc-mfa-seed
            path: coc-mfa-seed
  strategy:
    canary:
      steps:
      - setWeight: 10
      - pause:
          duration: 5m
      - analysis:
          templates:
          - templateName: rgs-canary-analysis
          args:
          - name: service-name
            value: admin
      - setWeight: 50
      - pause:
          duration: 5m
      - analysis:
          templates:
          - templateName: rgs-canary-analysis
          args:
          - name: service-name
            value: admin
      - setWeight: 100
      - pause:
          duration: 5m
      - analysis:
          templates:
          - templateName: rgs-canary-analysis
          args:
          - name: service-name
            value: admin
