# Rollout 金丝雀分析；每次采样覆盖最近 10 分钟
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: rgs-canary-analysis
  namespace: rust-game-server
spec:
  args:
  - name: service-name
  metrics:
  - name: p99-latency
    interval: 1m
    count: 10
    successCondition: result[0] < 3
    failureCondition: result[0] >= 3
    failureLimit: 1
    inconclusiveLimit: 1
    consecutiveErrorLimit: 1
    provider:
      prometheus:
        address: http://prometheus.rust-game-server.svc.cluster.local:9090
        query: histogram_quantile(0.99, sum by (le) (rate(rgs_http_request_duration_seconds_bucket{service=~"{{args.service-name}}"}[10m])))
  - name: error-rate
    interval: 1m
    count: 10
    successCondition: result[0] < 0.01
    failureCondition: result[0] >= 0.01
    failureLimit: 1
    inconclusiveLimit: 1
    consecutiveErrorLimit: 1
    provider:
      prometheus:
        address: http://prometheus.rust-game-server.svc.cluster.local:9090
        query: sum(rate(rgs_http_requests_total{service=~"{{args.service-name}}",status=~"(?i)(5..|5xx|error|failed|failure)"}[10m])) / clamp_min(sum(rate(rgs_http_requests_total{service=~"{{args.service-name}}"}[10m])), 1e-9)
