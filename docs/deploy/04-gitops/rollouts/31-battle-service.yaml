# 保留 battle-service 稳定 Service 名称与端口
apiVersion: v1
kind: Service
metadata:
  name: battle-service
  namespace: rust-game-server
  labels:
    app.kubernetes.io/component: domain-service
    app.kubernetes.io/name: battle
    app.kubernetes.io/part-of: rust-game-server
spec:
  ports:
  - name: grpc
    port: 50058
    protocol: TCP
    targetPort: 50058
  - name: metrics
    port: 9464
    protocol: TCP
    targetPort: 9464
  selector:
    app.kubernetes.io/name: battle
  type: ClusterIP
