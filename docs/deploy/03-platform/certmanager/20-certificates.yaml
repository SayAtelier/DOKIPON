# 六域服务证书；SAN、有效期及双向 TLS 用途沿用现有生成流程。
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rgs-player-tls
  labels:
    app.kubernetes.io/part-of: rust-game-server
    app.kubernetes.io/component: domain-certificate
spec:
  secretName: rgs-secret-player-tls
  commonName: player.service
  subject:
    organizations:
      - RustGameServer
  dnsNames:
    - player.service
  duration: 17520h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - digital signature
    - server auth
    - client auth
  issuerRef:
    name: rgs-player-ca-issuer
    kind: Issuer
    group: cert-manager.io
---
