# RGS 5 域 + cluster-ops k3s 部署
#
# 数据库指向已运行的 CloudNativePG cluster（service rgs-postgres-rw），
# 每域一个独立库（per ARC-008 5 独立 DB 原则），凭据来自 6 个
# *-db-credentials Secret（CNPG managed.roles 用同一套 password key）。
#
# TLS 来自 cert-manager 生成的 rgs-secret-<域>-tls 与 rgs-secret-ca。
# cert-manager 写 tls.crt / tls.key / ca.crt，而旧的 01-k8s-manifests/
# projection 用的是 ca.pem，所以这里显式把 ca.crt 映射成 ca.pem，
# 容器内路径保持不变。
#
# 标签不是装饰：rgs-postgres-ingress 这条 NetworkPolicy 只放行
# app.kubernetes.io/component in (domain-service, coc-control-plane,
# cluster-control-plane)。少了这个标签，Postgres 的 ClusterIP 对本 Pod 完全
# 不通，而 sqlx 只会报 "pool timed out while waiting for an open connection"，
# 不提示是网络策略拦的。admin-service 是 COC 控制面、cluster-ops 是集群控制面，
# 两者用各自对应的 component 值。

apiVersion: v1
kind: ConfigMap
metadata:
  name: rgs-config
  namespace: rust-game-server
data:
  RUST_LOG: "info,sqlx=warn,tonic=warn,quinn=warn"
  NATS_URI: "nats://nats:4222"
  RGS_TLS_DIR: "/etc/rgs/certs"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  RGS_ALLOW_INSECURE_GRPC: "1"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: player-service-account
  namespace: rust-game-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: player-service
  namespace: rust-game-server
  labels:
    app.kubernetes.io/name: player
    app.kubernetes.io/component: domain-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: player
  template:
    metadata:
      labels:
        app.kubernetes.io/name: player
        app.kubernetes.io/component: domain-service
    spec:
      serviceAccountName: player-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: player
          image: docker.io/dokipon/rgs-player-service:0.1.0
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: rgs-config
          env:
            - name: GRPC_ADDR
              value: "0.0.0.0:50051"
            - name: METRICS_PORT
              value: "9464"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: player-db-credentials
                  key: url
          ports:
            - name: grpc
              containerPort: 50051
            - name: metrics
              containerPort: 9464
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: rgs-tls
              mountPath: /etc/rgs/certs
              readOnly: true
      volumes:
        - name: rgs-tls
          projected:
            sources:
              - secret:
                  name: rgs-secret-player-tls
                  items:
                    - key: tls.crt
                      path: server.pem
                    - key: tls.key
                      path: server.key
              - secret:
                  name: rgs-secret-ca
                  items:
                    - key: ca.crt
                      path: ca.pem
---
apiVersion: v1
kind: Service
metadata:
  name: player-service
  namespace: rust-game-server
  labels:
    app.kubernetes.io/name: player
    app.kubernetes.io/component: domain-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: player
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
    - name: metrics
      port: 9464
      targetPort: 9464

