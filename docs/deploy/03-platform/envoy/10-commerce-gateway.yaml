apiVersion: gateway.networking.k8s.io/v1beta1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: commerce
  namespace: commerce
  annotations:
    cert-manager.io/issuer: rgs-ca-issuer
spec:
  gatewayClassName: eg
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: commerce-proxy
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop
  namespace: commerce
spec:
  parentRefs:
  - name: commerce
    sectionName: http
  hostnames:
  - shop.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /v1/
    backendRefs:
    - name: commerce-bff
      port: 8080
      weight: 1
  - backendRefs:
    - name: shop-web
      port: 8080
      weight: 1

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: admin
  namespace: commerce
spec:
  parentRefs:
  - name: commerce
    sectionName: http
  hostnames:
  - admin.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /admin/v1/
    backendRefs:
    - name: commerce-admin
      port: 8087
      weight: 1
  - backendRefs:
    - name: admin-web
      port: 8080
      weight: 1
