apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: commerce-proxy
  namespace: commerce
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: NodePort
        name: commerce-gateway
        patch:
          type: StrategicMerge
          value:
            spec:
              type: NodePort
              ports:
              - name: http-80
                port: 80
                targetPort: 10080
                nodePort: 30080
                protocol: TCP
              - name: https-443
                port: 443
                targetPort: 10443
                nodePort: 30443
                protocol: TCP
      envoyDaemonSet:
        name: commerce-envoy
        container:
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
  logging:
    level:
      default: info
