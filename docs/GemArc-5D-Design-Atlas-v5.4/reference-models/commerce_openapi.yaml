openapi: 3.1.0
info:
  title: Feliture Commerce Target API (Design Only)
  version: 0.1.0
  description: Hypothetical contract for AI engineering; not a reverse-engineered API.
servers:
  - url: https://api.example.invalid
paths:
  /v1/products:
    get:
      operationId: catalog.list
      parameters:
        - in: query
          name: cursor
          schema: {type: string}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200': {description: Paginated products}
        '429': {$ref: '#/components/responses/Problem'}
  /v1/products/{productId}:
    get:
      operationId: catalog.detail
      parameters:
        - in: path
          name: productId
          required: true
          schema: {type: string}
      responses:
        '200': {description: Product detail}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/checkouts:
    post:
      operationId: checkout.submit
      security: [{bearerAuth: []}]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CheckoutRequest'}
      responses:
        '201': {description: Confirmed checkout, if synchronous}
        '202': {description: Accepted and pending reconciliation}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /v1/checkouts/{checkoutId}:
    get:
      operationId: checkout.status
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: checkoutId
          required: true
          schema: {type: string}
      responses:
        '200': {description: Authoritative checkout status}
        '403': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  schemas:
    CheckoutRequest:
      type: object
      required: [cartId, expectedVersion, paymentMethodRef]
      additionalProperties: false
      properties:
        cartId: {type: string}
        expectedVersion: {type: integer, minimum: 1}
        paymentMethodRef: {type: string, description: Provider token only; never raw card details}
  responses:
    Problem:
      description: RFC 9457 compatible problem response
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status, code, traceId]
            properties:
              type: {type: string}
              title: {type: string}
              status: {type: integer}
              code: {type: string}
              detail: {type: string}
              traceId: {type: string}
              retryable: {type: boolean}
