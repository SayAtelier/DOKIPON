name: storefront_state
description: "A new Flutter package project."
publish_to: none
version: 0.0.1
homepage:

environment:
  sdk: ^3.13.5
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  domain_models:
    path: ../domain_models
  api_client:
    path: ../api_client

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # The controller drives the real [CommerceApiClient], so the test fakes the
  # transport with the same http client the client uses.
  http: ^1.2.0

